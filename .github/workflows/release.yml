name: Build and Publish Docker Image
on:
  push:
    tags:
      - "*"

jobs:
  build_arch:
    name: Build and push ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/nominatim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false

  create_manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build_arch
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/nominatim
      TAG: ${{ github.ref_name }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        id: manifest
        run: |
          AMD64_IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG}-amd64"
          ARM64_IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG}-arm64"
          TARGET_IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG}"

          docker buildx imagetools create \
            -t ${TARGET_IMAGE} \
            ${AMD64_IMAGE} \
            ${ARM64_IMAGE}

          # Capture the digest of the manifest list for attestation
          DIGEST=$(docker buildx imagetools inspect ${TARGET_IMAGE} --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: create_manifest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Nominatim ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: false
